<!doctype html>
<!-- The Roblox store's pictures, drawn with the web game's own art as og.png is
     (tools/og.html): ?kind=icon is the 512×512 icon, ?kind=thumb&lang=en|ko a
     1920×1080 thumbnail. roblox/tools/store/render.sh saves them all. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" />
    <style>
      html, body { margin: 0; overflow: hidden; background: #222; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="art"></canvas>
    <script type="module">
      import { drawHamster, drawFlower, drawSeed } from '../../../src/client/render.js';
      import { LOOKS } from '../../../src/client/looks.js';

      const query = new URLSearchParams(location.search);
      const kind = query.get('kind') || 'thumb';
      const lang = query.get('lang') || 'en';
      const TAGLINE = { en: 'Grab a seed and race home!', ko: '해씨 물고 집으로 달려라!' };
      await document.fonts.load('700 150px Fredoka');

      const canvas = document.getElementById('art');
      const [W, H] = kind === 'icon' ? [512, 512] : [1920, 1080];
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      function sky(w, h) {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#fff3c4');
        g.addColorStop(0.55, '#c9ec9a');
        g.addColorStop(1, '#7cc35a');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }

      function rays(x, y, length, spread) {
        ctx.save();
        ctx.translate(x, y);
        for (let i = 0; i < 18; i++) {
          ctx.rotate((Math.PI * 2) / 18);
          ctx.fillStyle = i % 2 ? 'rgba(255, 214, 90, 0.28)' : 'rgba(255, 240, 170, 0.32)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(length, -spread);
          ctx.lineTo(length, spread);
          ctx.fill();
        }
        ctx.restore();
      }

      function hill(w, h, y, amp, color, phase, wave = 170) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, h);
        for (let x = 0; x <= w; x += 8) ctx.lineTo(x, y + Math.sin(x / wave + phase) * amp);
        ctx.lineTo(w, h);
        ctx.fill();
      }

      // The sunflower on its stem, at (fx, fy), drawn `size` times the game's.
      function sunflower(fx, fy, size, bottom) {
        const k = size / 3.4;
        ctx.strokeStyle = '#3f8f3a';
        ctx.lineWidth = 26 * k;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(fx, fy + 120 * k);
        ctx.quadraticCurveTo(fx + 30 * k, fy + 300 * k, fx - 10 * k, bottom + 20);
        ctx.stroke();
        ctx.fillStyle = '#4ea443';
        for (const [x, y, rot] of [[fx + 20 * k, fy + 300 * k, -0.7], [fx + 5 * k, fy + 380 * k, 2.5]]) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot);
          ctx.beginPath();
          ctx.ellipse(55 * k, 0, 60 * k, 24 * k, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(size, size);
        drawFlower(ctx, { x: 0, y: 0 }, 0);
        ctx.restore();
      }

      // The title in the web game's style: cream rim, brown outline, sunny fill.
      function title(text, x, y, px, align = 'left') {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-0.05);
        ctx.font = `700 ${px}px Fredoka`;
        ctx.textAlign = align;
        ctx.textBaseline = 'alphabetic';
        ctx.lineJoin = 'round';
        const k = px / 168;
        ctx.fillStyle = 'rgba(70, 40, 15, 0.35)';
        ctx.fillText(text, 6 * k, 14 * k);
        ctx.lineWidth = 26 * k;
        ctx.strokeStyle = '#5b3416';
        ctx.strokeText(text, 0, 0);
        ctx.lineWidth = 10 * k;
        ctx.strokeStyle = '#fff8e7';
        ctx.strokeText(text, 0, 0);
        const fill = ctx.createLinearGradient(0, -130 * k, 0, 0);
        fill.addColorStop(0, '#ffe066');
        fill.addColorStop(1, '#ff9f1a');
        ctx.fillStyle = fill;
        ctx.fillText(text, 0, 0);
        ctx.restore();
      }

      function tagline(text, x, y, px) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-0.05);
        ctx.font = `700 ${px}px Fredoka, "Apple SD Gothic Neo", sans-serif`;
        ctx.textAlign = 'center';
        const k = px / 54;
        const tw = ctx.measureText(text).width;
        ctx.fillStyle = '#5b3416';
        ctx.beginPath();
        ctx.roundRect(-tw / 2 - 30 * k, -46 * k, tw + 60 * k, 84 * k, 42 * k);
        ctx.fill();
        ctx.fillStyle = '#fff8e7';
        ctx.fillText(text, 0, 16 * k);
        ctx.restore();
      }

      function hamster(look, x, y, size, o = {}) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(size, size);
        if (o.shadow !== false) {
          ctx.fillStyle = 'rgba(30, 60, 20, 0.22)';
          ctx.beginPath();
          ctx.ellipse(0, 16, 15, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        drawHamster(ctx, { x: 0, y: 0, fx: -0.6, fy: 0.25, moving: true, swing: null, t: 0.3, carrying: false, ...o, look: LOOKS[look] });
        ctx.restore();
      }

      if (kind === 'icon') {
        sky(W, H);
        rays(420, 90, 700, 80);
        hill(W, H, 380, 10, '#8fd06a', 0.6, 90);
        sunflower(410, 105, 2.3, H);
        hill(W, H, 430, 7, '#6fbd4e', 2.1, 80);
        drawSeed(ctx, 70, 470, 2.4, 0.5);
        drawSeed(ctx, 440, 480, 2.2, -0.8);
        // One hamster up close with a seed in its mouth.
        hamster(0, 230, 285, 7.4, { fx: -0.3, fy: 0.45, moving: false, carrying: true, t: 0, shadow: false });
        title('Hash Rush', W / 2, 488, 96, 'center');
      } else {
        // The link preview's scene, made 16:9 and 1.6 times as big.
        ctx.scale(1.6, 1.6);
        const w = 1200;
        const h = 675;
        const dy = 30;
        sky(w, h);
        // Long enough that no ray ends inside the picture.
        rays(995, 215 + dy, 1800, 190);
        hill(w, h, 445 + dy, 16, '#8fd06a', 0.4);
        sunflower(995, 215 + dy, 3.4, h);
        hill(w, h, 520 + dy, 10, '#6fbd4e', 2.1);
        ctx.font = '700 168px Fredoka';
        const titleW = ctx.measureText('Hash Rush').width;
        const left = 115;
        title('Hash Rush', left, 250 + dy, 168);
        tagline(TAGLINE[lang] || TAGLINE.en, left + titleW / 2, 340 + dy, 54);
        [[150, 645, 0.4], [430, 657, -0.9], [700, 643, 1.2], [1080, 650, 0.2], [880, 605, -0.5]].forEach(([x, y, r]) => drawSeed(ctx, x, y, 2.2, r));
        const runners = [
          { look: 0, x: 120, y: 470, carrying: true, t: 0.1 },
          { look: 4, x: 255, y: 505, t: 0.5 },
          { look: 1, x: 380, y: 455, t: 0.9 },
          { look: 6, x: 500, y: 510, t: 0.2 },
          { look: 2, x: 625, y: 470, t: 0.7 },
          { look: 5, x: 745, y: 520, t: 0.35 },
          { look: 3, x: 860, y: 480, t: 0.8 },
          { look: 7, x: 985, y: 525, t: 0.15 },
        ];
        for (const r of runners.sort((a, b) => a.y - b.y)) hamster(r.look, r.x, r.y + dy, 3.3, { carrying: !!r.carrying, t: r.t });
      }
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
