<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Hash Rush</title>
    <meta name="description" content="A hamster game of chicken: grab a sunflower seed and be the first one home." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="lobby" class="screen">
      <div class="card">
        <header>
          <h1>🌻 Hash Rush</h1>
          <p data-i18n="tagline"></p>
        </header>

        <section>
          <h2 data-i18n="players"></h2>
          <ul id="slots"></ul>
          <button id="addSlot" data-i18n="addSlot"></button>
          <div id="invite" hidden>
            <span id="inviteText"></span>
            <div class="row">
              <input id="inviteLink" readonly />
              <button id="copy" data-i18n="copy"></button>
            </div>
            <div id="watchRow" hidden>
              <span id="watchText"></span>
              <div class="row">
                <input id="watchLink" readonly />
                <button id="copyWatch" data-i18n="copy"></button>
              </div>
            </div>
          </div>
          <p id="netStatus" hidden></p>
        </section>

        <button id="start" class="primary"></button>

        <section class="howto">
          <h2 data-i18n="howto"></h2>
          <ul id="how"></ul>
        </section>
      </div>
    </main>

    <main id="stage" class="screen" hidden>
      <div id="field">
        <canvas id="canvas"></canvas>

        <div id="hud">
          <div id="scores"></div>
          <div id="side">
            <div id="clock">0:00</div>
            <div id="feed"></div>
          </div>
          <div id="banner"></div>
          <div id="big"></div>
          <div id="watching" data-i18n="spectating" hidden></div>
          <div id="hint" data-i18n="hint"></div>
          <div id="hintTouch" data-i18n="hintTouch" style="display: none"></div>
          <div id="tools">
            <button id="mute">🔊</button>
            <button id="quit" data-i18n="lobby"></button>
          </div>
        </div>

        <div id="result" hidden>
          <div class="card">
            <h2 id="resultTitle"></h2>
            <table id="resultTable"></table>
            <p id="resultWait" data-i18n="waitingRematch" hidden></p>
            <div class="row">
              <button id="again" class="primary" data-i18n="again"></button>
              <button id="back" data-i18n="lobby"></button>
            </div>
          </div>
        </div>
      </div>

      <div id="stick" hidden><div id="knob"></div></div>
      <button id="bonk" data-i18n="bonk"></button>
    </main>

    <script type="module" src="src/client/main.js"></script>
  </body>
</html>
