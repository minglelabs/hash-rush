<!doctype html>
<!-- Draws the link preview image (og.png) with the game's own art.
     Open over http (npm run dev) and save the canvas, or run tools/og.mjs. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Jua&display=swap" />
    <style>
      body { margin: 0; background: #222; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="og" width="1200" height="630"></canvas>
    <script type="module">
      import { drawHamster, drawFlower, drawSeed } from '../src/client/render.js';
      import { LOOKS } from '../src/client/looks.js';

      await document.fonts.load('700 150px Fredoka');
      await document.fonts.load('44px Jua', '해바라기씨 물고 집까지 달려라!');
      const W = 1200;
      const H = 630;
      const ctx = document.getElementById('og').getContext('2d');

      // Sunny sky fading into the meadow.
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#fff3c4');
      sky.addColorStop(0.55, '#c9ec9a');
      sky.addColorStop(1, '#7cc35a');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Sun rays behind the flower.
      const fx = 995;
      const fy = 215;
      ctx.save();
      ctx.translate(fx, fy);
      for (let i = 0; i < 18; i++) {
        ctx.rotate((Math.PI * 2) / 18);
        ctx.fillStyle = i % 2 ? 'rgba(255, 214, 90, 0.28)' : 'rgba(255, 240, 170, 0.32)';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(900, -95);
        ctx.lineTo(900, 95);
        ctx.fill();
      }
      ctx.restore();

      // Rolling hills.
      const hill = (y, amp, color, phase) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += 10) ctx.lineTo(x, y + Math.sin(x / 170 + phase) * amp);
        ctx.lineTo(W, H);
        ctx.fill();
      };
      hill(445, 16, '#8fd06a', 0.4);

      // Stem and leaves, then the flower itself, scaled up.
      ctx.strokeStyle = '#3f8f3a';
      ctx.lineWidth = 26;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fx, fy + 120);
      ctx.quadraticCurveTo(fx + 30, fy + 300, fx - 10, H + 20);
      ctx.stroke();
      ctx.fillStyle = '#4ea443';
      for (const [x, y, rot] of [[fx + 20, fy + 300, -0.7], [fx + 5, fy + 380, 2.5]]) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.ellipse(55, 0, 60, 24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.save();
      ctx.translate(fx, fy);
      ctx.scale(3.4, 3.4);
      drawFlower(ctx, { x: 0, y: 0 }, 0);
      ctx.restore();

      hill(520, 10, '#6fbd4e', 2.1);

      // Title.
      ctx.save();
      ctx.translate(70, 250);
      ctx.rotate(-0.05);
      ctx.font = '700 168px Fredoka';
      ctx.textBaseline = 'alphabetic';
      ctx.lineJoin = 'round';
      const title = 'Hash Rush';
      ctx.fillStyle = 'rgba(70, 40, 15, 0.35)';
      ctx.fillText(title, 6, 14);
      ctx.lineWidth = 26;
      ctx.strokeStyle = '#5b3416';
      ctx.strokeText(title, 0, 0);
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#fff8e7';
      ctx.strokeText(title, 0, 0);
      const fill = ctx.createLinearGradient(0, -130, 0, 0);
      fill.addColorStop(0, '#ffe066');
      fill.addColorStop(1, '#ff9f1a');
      ctx.fillStyle = fill;
      ctx.fillText(title, 0, 0);
      ctx.restore();

      // Tagline on a little sign.
      ctx.save();
      ctx.translate(92, 300);
      ctx.rotate(-0.05);
      ctx.font = '44px Jua';
      const tag = '해바라기씨 물고 집까지 달려라!';
      const tw = ctx.measureText(tag).width;
      ctx.fillStyle = '#5b3416';
      ctx.beginPath();
      ctx.roundRect(-4, 6, tw + 48, 70, 35);
      ctx.fill();
      ctx.fillStyle = '#fff8e7';
      ctx.fillText(tag, 20, 56);
      ctx.restore();

      // Seeds scattered in the grass.
      [[150, 600, 0.4], [430, 612, -0.9], [700, 598, 1.2], [1080, 605, 0.2], [880, 560, -0.5]].forEach(([x, y, r]) => drawSeed(ctx, x, y, 2.2, r));

      // Eight hamsters racing home (left), the leader with a seed.
      const runners = [
        { look: 0, x: 120, y: 470, carrying: true, t: 0.1 },
        { look: 4, x: 255, y: 505, t: 0.5 },
        { look: 1, x: 380, y: 455, t: 0.9 },
        { look: 6, x: 500, y: 510, t: 0.2 },
        { look: 2, x: 625, y: 470, t: 0.7 },
        { look: 5, x: 745, y: 520, t: 0.35 },
        { look: 3, x: 860, y: 480, t: 0.8 },
        { look: 7, x: 985, y: 525, t: 0.15 },
      ];
      for (const r of runners.sort((a, b) => a.y - b.y)) {
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.scale(3.3, 3.3);
        ctx.fillStyle = 'rgba(30, 60, 20, 0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 16, 15, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();
        drawHamster(ctx, { x: 0, y: 0, fx: -0.6, fy: 0.25, moving: true, carrying: !!r.carrying, swing: null, look: LOOKS[r.look], t: r.t });
        ctx.restore();
      }
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
