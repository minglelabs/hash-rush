<!doctype html>
<!-- Draws Steam store art with the game's own drawings, at any size.
     tools/steam-art.cjs renders every image the store needs from it.
       ?kind=scene&w=920&h=430[&logo=0][&tag=0]   capsules, hero, backgrounds
       ?kind=logo&w=1280&h=720                    title on a clear background
       ?kind=icon&w=184                           community icon
       ?kind=ach&id=WIN_FIRST[&locked=1]&w=256    achievement icon
     When drawn, the page sets body[data-ready] and window.art (a PNG data URL). -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" />
    <style>
      body { margin: 0; background: #222; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="art"></canvas>
    <script type="module">
      import { drawHamster, drawFlower, drawSeed } from '../src/client/render.js';
      import { LOOKS } from '../src/client/looks.js';

      const q = new URLSearchParams(location.search);
      const kind = q.get('kind') || 'scene';
      const W = Number(q.get('w')) || 920;
      const H = Number(q.get('h')) || (kind === 'icon' || kind === 'ach' ? W : 430);
      const canvas = document.getElementById('art');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      await document.fonts.load('700 150px Fredoka');

      const TITLE = 'Hash Rush';
      const TAG = 'Grab a seed and race home!';
      const MAP_ICONS = { MEADOW: '🌻', DESERT: '🌵', FACTORY: '🏭', ICE: '🧊', BEACH: '🏖️', GRAVEYARD: '👻', SKY: '☁️' };
      const MAP_TINT = {
        MEADOW: ['#bfe89a', '#5fae45'],
        DESERT: ['#ffe2a8', '#d89a4a'],
        FACTORY: ['#d5d9e0', '#7b8494'],
        ICE: ['#dff3ff', '#6db7e8'],
        BEACH: ['#fff1c9', '#41b8d5'],
        GRAVEYARD: ['#cfc4e6', '#5c4d82'],
        SKY: ['#e3f1ff', '#7fa7e8'],
      };

      // The game's title: gold letters, a cream rim and a brown outline.
      function title(text, x, y, size, rot = -0.05, align = 'left') {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.font = `700 ${size}px Fredoka`;
        ctx.textAlign = align;
        ctx.textBaseline = 'alphabetic';
        ctx.lineJoin = 'round';
        const k = size / 168;
        ctx.fillStyle = 'rgba(70, 40, 15, 0.35)';
        ctx.fillText(text, 6 * k, 14 * k);
        ctx.lineWidth = 26 * k;
        ctx.strokeStyle = '#5b3416';
        ctx.strokeText(text, 0, 0);
        ctx.lineWidth = 10 * k;
        ctx.strokeStyle = '#fff8e7';
        ctx.strokeText(text, 0, 0);
        const fill = ctx.createLinearGradient(0, -size * 0.78, 0, 0);
        fill.addColorStop(0, '#ffe066');
        fill.addColorStop(1, '#ff9f1a');
        ctx.fillStyle = fill;
        ctx.fillText(text, 0, 0);
        ctx.restore();
      }
      const titleWidth = (text, size) => {
        ctx.font = `700 ${size}px Fredoka`;
        return ctx.measureText(text).width;
      };

      function sign(text, x, y, size, rot = -0.05) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.font = `700 ${size}px Fredoka`;
        ctx.textAlign = 'center';
        const tw = ctx.measureText(text).width;
        const pad = size * 0.55;
        ctx.fillStyle = '#5b3416';
        ctx.beginPath();
        ctx.roundRect(-tw / 2 - pad, -size * 0.85, tw + pad * 2, size * 1.55, size * 0.78);
        ctx.fill();
        ctx.fillStyle = '#fff8e7';
        ctx.fillText(text, 0, size * 0.3);
        ctx.restore();
      }

      function hamster(x, y, s, look, { carrying = false, t = 0, fx = -0.6, fy = 0.25, shadow = true } = {}) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        if (shadow) {
          ctx.fillStyle = 'rgba(30, 60, 20, 0.22)';
          ctx.beginPath();
          ctx.ellipse(0, 16, 15, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        drawHamster(ctx, { x: 0, y: 0, fx, fy, moving: true, carrying, swing: null, look: LOOKS[look], t });
        ctx.restore();
      }

      function flower(fx, fy, s, stemTo) {
        ctx.strokeStyle = '#3f8f3a';
        ctx.lineWidth = 7.6 * s;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(fx, fy + 35 * s);
        ctx.quadraticCurveTo(fx + 9 * s, fy + 88 * s, fx - 3 * s, stemTo);
        ctx.stroke();
        ctx.fillStyle = '#4ea443';
        for (const [dx, dy, rot] of [[6, 88, -0.7], [1.5, 112, 2.5]]) {
          if (fy + dy * s > stemTo) continue;
          ctx.save();
          ctx.translate(fx + dx * s, fy + dy * s);
          ctx.rotate(rot);
          ctx.beginPath();
          ctx.ellipse(16 * s, 0, 17.6 * s, 7 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(s, s);
        drawFlower(ctx, { x: 0, y: 0 }, 0);
        ctx.restore();
      }

      function rays(fx, fy, len) {
        ctx.save();
        ctx.translate(fx, fy);
        for (let i = 0; i < 18; i++) {
          ctx.rotate((Math.PI * 2) / 18);
          ctx.fillStyle = i % 2 ? 'rgba(255, 214, 90, 0.28)' : 'rgba(255, 240, 170, 0.32)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(len, -len * 0.105);
          ctx.lineTo(len, len * 0.105);
          ctx.fill();
        }
        ctx.restore();
      }

      function hill(y, amp, color, phase, period) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, y + Math.sin(x / period + phase) * amp);
        ctx.lineTo(W, H);
        ctx.fill();
      }

      function sky() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#fff3c4');
        g.addColorStop(0.55, '#c9ec9a');
        g.addColorStop(1, '#7cc35a');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      const LOOK_ORDER = [0, 4, 1, 6, 2, 5, 3, 7];

      // A wide picture: the flower on the right, the title on the left, eight
      // hamsters racing home along the bottom (the leader with a seed).
      function wide({ logo, tag }) {
        const u = H / 630;
        const big = W / H > 2.4; // the small capsule: the title has to read at a glance
        sky();
        const fx = W - 205 * u;
        const fy = 215 * u;
        rays(fx, fy, Math.max(W, H) * 1.1);
        hill(445 * u, 16 * u, '#8fd06a', 0.4, 170 * u);
        flower(fx, fy, 3.4 * u, H + 20 * u);
        hill(520 * u, 10 * u, '#6fbd4e', 2.1, 170 * u);
        [[0.12, 600, 0.4], [0.36, 612, -0.9], [0.58, 598, 1.2], [0.9, 605, 0.2], [0.73, 560, -0.5]].forEach(([x, y, r]) => drawSeed(ctx, x * W, y * u, 2.2 * u, r));
        const from = 120 * u;
        const to = W - 215 * u;
        const runners = LOOK_ORDER.map((look, i) => ({ look, x: from + ((to - from) * i) / 7, y: (i % 2 ? 505 : 470) * u + (i % 3) * 8 * u, carrying: i === 0, t: (i * 0.37) % 1 }));
        for (const r of runners.sort((a, b) => a.y - b.y)) hamster(r.x, r.y, 3.3 * u, r.look, r);
        if (!logo) return;
        if (big) {
          const size = Math.min(H * 0.62, ((fx - 200 * u - W * 0.04) / titleWidth(TITLE, 100)) * 100);
          title(TITLE, W * 0.04, H * 0.62, size);
          return;
        }
        const size = 168 * u;
        const left = 115 * u;
        title(TITLE, left, 250 * u, size);
        if (tag) sign(TAG, left + titleWidth(TITLE, size) / 2, 340 * u, 54 * u);
      }

      // A tall picture: the flower over the stacked title, hamsters in two rows below.
      function tall({ logo, tag }) {
        // Laid out on a 600x900 board, scaled to fit and centred across the width.
        const u = Math.min(W / 600, H / 900);
        const ox = (W - 600 * u) / 2;
        const Hd = H / u;
        const X = (x) => ox + x * u;
        sky();
        const fx = X(445);
        const fy = 170 * u;
        rays(fx, fy, H * 1.3);
        hill((Hd - 250) * u, 14 * u, '#8fd06a', 0.4, 120 * u);
        flower(fx, fy, 2.9 * u, (Hd - 230) * u);
        hill((Hd - 170) * u, 10 * u, '#6fbd4e', 2.1, 120 * u);
        [[0.1, Hd - 30, 0.4], [0.45, Hd - 20, -0.9], [0.85, Hd - 35, 1.2]].forEach(([x, y, r]) => drawSeed(ctx, x * W, y * u, 2 * u, r));
        const rows = [Hd - 170, Hd - 82];
        const runners = LOOK_ORDER.map((look, i) => ({ look, x: X(95 + (i % 4) * 135 + (i >= 4 ? 55 : 0)), y: rows[i >= 4 ? 1 : 0] * u + ((i * 13) % 12) * u, carrying: i === 0, t: (i * 0.37) % 1 }));
        for (const r of runners.sort((a, b) => a.y - b.y)) hamster(r.x, r.y, 2.7 * u, r.look, r);
        if (!logo) return;
        const size = Math.min(170, (520 / titleWidth('Rush', 100)) * 100) * u;
        const top = Hd * 0.43;
        title('Hash', X(60), top * u, size, -0.06);
        title('Rush', X(120), top * u + size * 0.9, size, -0.06);
        if (tag) sign(TAG, W / 2, top * u + size * 0.9 + 85 * u, 36 * u, -0.04);
      }

      function scene() {
        const logo = q.get('logo') !== '0';
        const tag = q.get('tag') !== '0';
        if (W / H >= 1.2) wide({ logo, tag });
        else tall({ logo, tag });
      }

      // The title alone, centred, for the library logo over the hero art.
      function logoOnly() {
        const size = Math.min(H * 0.6, ((W * 0.9) / titleWidth(TITLE, 100)) * 100);
        title(TITLE, W / 2, H / 2 + size * 0.32, size, -0.04, 'center');
      }

      function roundBadge(c0, c1) {
        const r = W * 0.16;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(W * 0.04, H * 0.04, W * 0.92, H * 0.92, r);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, c0);
        g.addColorStop(1, c1);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.lineWidth = W * 0.035;
        ctx.strokeStyle = '#5b3416';
        ctx.stroke();
        ctx.restore();
      }

      function number(text) {
        const size = W * 0.36;
        ctx.save();
        ctx.font = `700 ${size}px Fredoka`;
        ctx.textAlign = 'center';
        ctx.lineJoin = 'round';
        ctx.lineWidth = size * 0.16;
        ctx.strokeStyle = '#5b3416';
        ctx.strokeText(text, W * 0.68, H * 0.88);
        ctx.fillStyle = '#fff8e7';
        ctx.fillText(text, W * 0.68, H * 0.88);
        ctx.restore();
      }

      function emoji(ch, x, y, size) {
        ctx.save();
        ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ch, x, y);
        ctx.restore();
      }

      // Achievement icons: a badge for each, greyed out when still locked.
      function achievement() {
        const id = q.get('id') || 'WIN_FIRST';
        // JPG has no clear corners: they take the frame's colour.
        ctx.fillStyle = '#3b2210';
        ctx.fillRect(0, 0, W, H);
        if (q.get('locked') === '1') ctx.filter = 'grayscale(1) brightness(0.62) contrast(0.9)';
        const s = W / 256;
        const map = id.startsWith('WIN_MAP_') && id.slice(8);
        if (map) {
          const [c0, c1] = MAP_TINT[map] || ['#eee', '#999'];
          roundBadge(c0, c1);
          emoji(MAP_ICONS[map] || '🌻', W * 0.5, H * 0.44, W * 0.46);
          drawSeed(ctx, W * 0.74, H * 0.76, 4.2 * s, 0.5);
          return;
        }
        switch (id) {
          case 'WIN_FIRST':
            roundBadge('#fff1b8', '#ffb627');
            hamster(W * 0.5, H * 0.54, 4.1 * s, 0, { carrying: true, fx: 0, fy: 1, shadow: false });
            break;
          case 'WIN_10':
            roundBadge('#ffe9c7', '#f08c2e');
            drawSeed(ctx, W * 0.34, H * 0.42, 7 * s, -0.4);
            number('10');
            break;
          case 'WIN_50':
            roundBadge('#fff6d0', '#e0a400');
            ctx.save();
            ctx.translate(W * 0.36, H * 0.4);
            ctx.scale(1.25 * s, 1.25 * s);
            drawFlower(ctx, { x: 0, y: 0 }, 0);
            ctx.restore();
            number('50');
            break;
          case 'WIN_TEAM':
            roundBadge('#d8e6ff', '#3f74e0');
            hamster(W * 0.31, H * 0.55, 2.9 * s, 1, { fx: 0, fy: 1, shadow: false });
            hamster(W * 0.69, H * 0.55, 2.9 * s, 2, { carrying: true, fx: 0, fy: 1, shadow: false });
            break;
          case 'WIN_VS_PEOPLE':
            roundBadge('#ffdcdc', '#e5484d');
            hamster(W * 0.29, H * 0.6, 2.9 * s, 0, { fx: 1, fy: 0, shadow: false });
            hamster(W * 0.71, H * 0.6, 2.9 * s, 6, { fx: -1, fy: 0, shadow: false });
            emoji('💥', W * 0.5, H * 0.32, W * 0.3);
            break;
          case 'WIN_ALL_MAPS': {
            roundBadge('#fff3c4', '#8f6be8');
            const ring = Object.values(MAP_ICONS);
            ring.forEach((ch, i) => {
              const a = -Math.PI / 2 + (i / ring.length) * Math.PI * 2;
              emoji(ch, W * 0.5 + Math.cos(a) * W * 0.29, H * 0.5 + Math.sin(a) * H * 0.29, W * 0.2);
            });
            emoji('👑', W * 0.5, H * 0.5, W * 0.3);
            break;
          }
          default:
            roundBadge('#eee', '#999');
        }
      }

      // The community icon: the hamster with its seed, on the meadow.
      function icon() {
        const g = ctx.createRadialGradient(W / 2, H * 0.4, W * 0.1, W / 2, H / 2, W * 0.7);
        g.addColorStop(0, '#d9f5b0');
        g.addColorStop(1, '#5fae45');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        hamster(W / 2, H * 0.55, (W / 184) * 4.4, 0, { carrying: true, fx: 0, fy: 1 });
      }

      if (kind === 'logo') logoOnly();
      else if (kind === 'icon') icon();
      else if (kind === 'ach') achievement();
      else scene();
      window.art = canvas.toDataURL('image/png');
      document.body.dataset.ready = '1';
    </script>
  </body>
